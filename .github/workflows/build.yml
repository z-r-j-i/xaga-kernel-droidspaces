name: Build xaga GKI container kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_sublevel:
        description: '5.10.x sublevel (stock = 226)'
        default: '226'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc; df -h /

      - name: 安装工具链
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc bison flex libncurses-dev libssl-dev cpio zstd zip unzip python3 curl git patch file dwarves libelf-dev clang-12 lld-12 llvm-12
          echo "---- 工具链自检 ----"
          /usr/lib/llvm-12/bin/clang --version | head -1
          /usr/lib/llvm-12/bin/ld.lld --version | head -1
          pahole --version || true

      - name: 编译并打包
        env:
          TARGET_SUBLEVEL: ${{ github.event.inputs.target_sublevel || '226' }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaga-gki-kernel
          path: |
            artifacts/*
            build.log
          if-no-files-found: ignore
          retention-days: 30
